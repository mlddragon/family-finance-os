name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Refresh date-sensitive synthetic import pack
        run: python scripts/generate_synthetic_import_pack.py

      - name: Run API and script tests
        run: pytest

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Run web tests
        working-directory: apps/web
        run: npm test

      - name: Install browser test runtime
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Build Docker image
        run: docker build .

      - name: Run Docker E2E closed loop
        run: |
          set -euo pipefail
          DATA_ROOT="$(mktemp -d)"
          mkdir -p "$DATA_ROOT"/{inbox,raw,processed,quarantine,database,reports,monthly_close,exports,logs,manifests}
          chmod -R 0777 "$DATA_ROOT"
          export FFOS_DATA_ROOT="$DATA_ROOT"
          export FFOS_HOST_PORT=28081
          export APP_ENV=qa
          export APP_ENV_LABEL="QA synthetic demo"
          export DATASET_KIND=synthetic
          export DEV_MODE=true
          trap 'docker compose -p ffos-ci-qa down >/dev/null 2>&1 || true; chmod -R 0777 "$DATA_ROOT" >/dev/null 2>&1 || true; rm -rf "$DATA_ROOT" >/dev/null 2>&1 || true' EXIT
          docker compose -p ffos-ci-qa up -d --build
          python scripts/run_docker_e2e.py --base-url http://127.0.0.1:28081 --data-root "$DATA_ROOT"
